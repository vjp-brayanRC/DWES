<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Datos html</title>
</head>
<body>
    <form action="204datosPersonales.php" method="get">

    <p><label for="nombre">Nombre: </label>
